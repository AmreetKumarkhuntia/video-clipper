services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: video_clipper
      POSTGRES_USER: video_clipper
      POSTGRES_PASSWORD: video_clipper
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U video_clipper -d video_clipper']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - video_clipper_postgres:/var/lib/postgresql/data

volumes:
  video_clipper_postgres:
