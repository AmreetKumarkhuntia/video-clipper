name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  checks:
    name: Verify release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish verified CLI archives
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout the checked source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and release plugin
        run: pnpm build:cli

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version, verify, and publish
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep archives and receipts for inspection or publication recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-${{ github.sha }}
          path: |
            artifacts/releases/
            artifacts/cli-build.json
          if-no-files-found: ignore
          retention-days: 14
