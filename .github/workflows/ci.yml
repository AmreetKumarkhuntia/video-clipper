name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  ci:
    name: Type-check, Format, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://video_clipper:video_clipper@127.0.0.1:5432/video_clipper_test
      TEST_DATABASE_URL: postgresql://video_clipper:video_clipper@127.0.0.1:5432/video_clipper_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: video_clipper_test
          POSTGRES_USER: video_clipper
          POSTGRES_PASSWORD: video_clipper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_clipper -d video_clipper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Web type-check
        run: pnpm web:check

      - name: Build
        run: pnpm build

      - name: Web build
        run: pnpm web:build

  cli-package:
    name: CLI package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm verify:cli-package

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://video_clipper:video_clipper@127.0.0.1:5432/video_clipper_test
      TEST_DATABASE_URL: postgresql://video_clipper:video_clipper@127.0.0.1:5432/video_clipper_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: video_clipper_test
          POSTGRES_USER: video_clipper
          POSTGRES_PASSWORD: video_clipper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U video_clipper -d video_clipper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            temp/playwright-results
            temp/playwright-report
          if-no-files-found: ignore
          retention-days: 7
